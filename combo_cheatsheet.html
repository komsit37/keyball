<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keyball44 Combo Cheat Sheet</title>
<style>
:root {
  --bg: #f6f6f6;
  --ink: #1b1b1b;
  --accent: #3b82f6;
  --label-bg: rgba(59, 130, 246, 0.14);
}
body {
  margin: 0;
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
}
.wrapper {
  max-width: 1896px;
  margin: 24px auto 40px;
  padding: 0 16px;
}
.stage {
  position: relative;
  width: 1896px;
  height: 630px;
  margin: 0 auto;
  box-shadow: 0 18px 50px rgba(0,0,0,0.12);
  border-radius: 18px;
  overflow: hidden;
  background: #fff;
}
.stage img {
  width: 100%;
  height: 100%;
  display: block;
}
.stage svg {
  position: absolute;
  inset: 0;
}
.combo-line {
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linecap: round;
  opacity: 0.8;
}
.combo-label rect {
  fill: var(--label-bg);
  stroke: var(--accent);
  stroke-width: 1.5;
}
.combo-label text {
  font-size: 12px;
  font-weight: 600;
  fill: var(--ink);
}
.list {
  margin: 20px 0 0;
  font-size: 14px;
}
.list h2 {
  margin: 0 0 8px;
  font-size: 16px;
}
.list ul {
  margin: 0;
  padding-left: 18px;
}
</style>
</head>
<body>
  <div class="wrapper">
    <div class="stage">
      <img src="assets/keyball_layout.png" alt="Keyball44 layout" />
      <svg viewBox="0 0 1896 630" preserveAspectRatio="none">
        
        
      </svg>
    </div>
    <div class="list">
      <h2>Unplaced combos (missing key coords)</h2>
      <ul>
        <li> → BSPC</li>
<li> → 9</li>
<li> → 0</li>
<li> → DEL</li>
<li> → A</li>
<li> → Caps Word</li>
<li> → C</li>
<li> → V</li>
<li> → ,</li>
<li> → [</li>
<li> → `</li>
<li> → LEFT</li>
<li> → -</li>
<li> → -</li>
<li> → [</li>
<li> → ]</li>
<li> → ,</li>
<li> → ,</li>
<li> → .</li>
<li> → ]</li>
<li> → Toggle L</li>
<li> → Toggle L</li>
      </ul>
    </div>
  </div>
</body>
</html>
